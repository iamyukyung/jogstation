<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
/* Base reset (matches the environment the page was designed in) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>JogStation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap">
<style>
/* Layout: one phone-sized app; music player fills the screen, a stats sheet slides up from the bottom. Single dark look by choice (matches the 2016 design). */
:root {
  --bg: #000;
  --ink: #fff;
  --ink-2: rgba(255,255,255,.62);
  --ink-3: rgba(255,255,255,.34);
  --line: rgba(255,255,255,.12);
  --violet: #9013FE;
  --violet-2: #A840D0;
  --violet-text: #B45CFF;
  --stage: #0d0a12;
  /* Motion: one curve for everything; three durations by role */
  --ease: cubic-bezier(.3,.8,.3,1);
  --dur-chart: .75s;  /* chart entrances: bars, heart graph, distance ring */
  --dur-move: .35s;   /* sheet, page slide, tab underline, shade */
  --dur-fade: .25s;   /* opacity / color changes */
  --font: "Figtree", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage); color: var(--ink); font-family: var(--font);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--violet-text); outline-offset: 3px; border-radius: 6px; }
svg { display: block; }

.phone {
  position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg);
  user-select: none; -webkit-user-select: none; touch-action: none;
}
@media (min-width: 560px) and (min-height: 700px) {
  .phone { width: 390px; height: min(800px, calc(100% - 48px)); border-radius: 44px;
    box-shadow: 0 0 0 10px #1b1722, 0 0 0 11px #2c2636, 0 40px 80px rgba(0,0,0,.6); }
}

/* ---------- Player ---------- */
.player { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
.player-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(28px) saturate(1.2) brightness(.62); transform: scale(1.1); transition: background-image .6s; }
.player-bg::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(40,20,60,.35) 0%, rgba(20,10,30,.1) 45%, rgba(0,0,0,.75) 100%); }
.topbar { position: relative; width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; padding: 18px 12px 0; z-index: 2; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.icon-btn svg { width: 22px; height: 22px; }
/* Like: heart squashes, springs up while filling, and throws a ring + sparks */
.like { position: relative; }
.like path { transition: fill var(--dur-fade) var(--ease); }
.like.on path { fill: #fff; }
.like.pop svg { animation: likePop .5s var(--ease); }
.like.unpop svg { animation: likeUnpop .3s var(--ease); }
@keyframes likePop { 0% { transform: scale(1) } 18% { transform: scale(.68) } 55% { transform: scale(1.32) } 78% { transform: scale(.94) } 100% { transform: scale(1) } }
@keyframes likeUnpop { 0% { transform: scale(1) } 45% { transform: scale(.78) } 100% { transform: scale(1) } }
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.burst .ring { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--violet-text); animation: likeRing .55s var(--ease) both; }
.burst .spark { position: absolute; left: -2.5px; top: -2.5px; width: 5px; height: 5px; border-radius: 50%;
  transform: rotate(var(--a)) translateY(0) scale(1); animation: likeSpark .6s var(--ease) .06s both; }
@keyframes likeRing { 0% { transform: scale(.3); opacity: 1; border-width: 6px } 100% { transform: scale(1.5); opacity: 0; border-width: 1px } }
@keyframes likeSpark { 0% { transform: rotate(var(--a)) translateY(-8px) scale(1); opacity: 1 } 100% { transform: rotate(var(--a)) translateY(-24px) scale(0); opacity: 0 } }

.disc-wrap { position: relative; margin-top: clamp(16px, 6vh, 56px); display: flex; align-items: center; gap: 14px; z-index: 1; }
.disc { position: relative; width: 236px; height: 236px; border-radius: 50%; }
.disc svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.disc .art { position: absolute; inset: 18px; border-radius: 50%; overflow: hidden; isolation: isolate; background: #1a1222;
  box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: transform .4s cubic-bezier(.3,1.4,.5,1), filter .3s; }
/* Each cover is its own round "disc" that swings on a pivot far below the window, so it travels along an arc */
.art-layer { position: absolute; inset: 0; border-radius: 50%; background-size: cover; background-position: center;
  transform-origin: 50% 260%; will-change: transform; }
.disc.paused .art { transform: scale(.94); filter: brightness(.75); }
.disc .playstate { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity var(--dur-fade) var(--ease); }
.disc.paused .playstate { opacity: 1; }
.playstate span { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.35); backdrop-filter: blur(6px); display: grid; place-items: center; }
.skip svg { width: 18px; height: 18px; }

.track { position: relative; text-align: center; margin-top: 26px; z-index: 1; padding-inline: 24px; }
.track h1 { font-size: 22px; font-weight: 500; letter-spacing: .01em; text-wrap: balance; }
.track p { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.track .time { margin-top: 10px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.run-btn { position: absolute; left: 50%; bottom: 122px; transform: translateX(-50%); z-index: 2;
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 35%, #B347FF, var(--violet) 70%);
  box-shadow: 0 10px 30px rgba(144,19,254,.45); transition: background var(--dur-fade) var(--ease), box-shadow var(--dur-fade) var(--ease); }
.run-btn svg { width: 28px; height: 28px; }
.run-btn.paused { background: #3a3346; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
/* Running figure in the play button: jointed limbs on a 0.62s stride */
.run-btn svg.runner { width: 34px; height: 34px; overflow: visible; --stride: .62s; }
.runner g { transform-box: view-box; }
.r-body { animation: rBob calc(var(--stride) / 2) ease-in-out infinite; }
.r-far { opacity: .6; }
.r-thigh { transform-origin: 11px 13.4px; animation: rThigh var(--stride) ease-in-out infinite; }
.r-shin { transform-origin: 11px 17.8px; animation: rShin var(--stride) linear infinite; }
.r-arm { transform-origin: 12.4px 8.4px; animation: rArm var(--stride) ease-in-out infinite; }
.r-fore { transform-origin: 12.4px 11.4px; transform: rotate(-75deg); }
.r-thigh.b, .r-shin.b, .r-arm.b { animation-delay: calc(var(--stride) / -2); }
@keyframes rBob { 0%, 100% { transform: translateY(.5px) } 50% { transform: translateY(-.7px) } }
@keyframes rThigh { 0%, 100% { transform: rotate(-42deg) } 50% { transform: rotate(34deg) } }
@keyframes rShin { 0%, 100% { transform: rotate(18deg) } 25% { transform: rotate(28deg) } 55% { transform: rotate(100deg) } 80% { transform: rotate(70deg) } }
@keyframes rArm { 0%, 100% { transform: rotate(40deg) } 50% { transform: rotate(-48deg) } }
.run-btn .ic-play { display: none; }
.run-btn.paused .ic-run { display: none; }
.run-btn.paused .ic-play { display: block; }

/* Hint bubble */
.hint { position: absolute; left: 20px; right: 20px; bottom: 68px; z-index: 6; pointer-events: none;
  background: rgba(255,255,255,.93); color: #8A2BE2; border-radius: 12px; padding: 14px 18px;
  display: flex; align-items: center; gap: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.35);
  transform: scale(0); transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.5,.5,.5,1.5), opacity .25s; }
.hint.show { transform: scale(1); }
/* Leaving: no bounce; it drops slightly toward its tail and fades, then is removed after the transition ends */
.hint.gone { opacity: 0; transform: translateY(8px) scale(.94);
  transition: opacity var(--dur-fade) var(--ease), transform var(--dur-move) var(--ease); }
.hint::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px;
  border: 9px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.93); }
.hint b { display: block; font-size: 17px; font-weight: 600; }
.hint small { font-size: 13px; color: #9b4fd9; }
.hint .arrow { flex: none; width: 22px; height: 38px; position: relative; }
.hint .arrow i { position: absolute; left: 0; right: 0; top: 0; height: 100%;
  background: linear-gradient(180deg, #C77DFF, rgba(199,125,255,0)); clip-path: polygon(50% 0, 100% 36%, 68% 36%, 68% 100%, 32% 100%, 32% 36%, 0 36%);
  animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateY(6px); opacity: .5 } 50% { transform: translateY(-4px); opacity: 1 } }

/* ---------- Shade over player when sheet is open ---------- */
.shade { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity var(--dur-move) var(--ease); z-index: 3; }
.app.open .shade { opacity: 1; pointer-events: auto; }

/* ---------- Stats sheet ---------- */
.sheet { --sheet-h: min(470px, calc(100% - 150px)); position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet-h);
  z-index: 4; background: var(--bg); display: flex; flex-direction: column;
  transform: translateY(calc(100% - 52px - env(safe-area-inset-bottom, 0px)));
  transition: transform var(--dur-move) var(--ease); }
.app.open .sheet { transform: translateY(0); }
.sheet.dragging { transition: none; }
.summary { position: relative; flex: none; height: 52px; display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--violet); border-bottom: 1px solid var(--line); background: #050307; }
.summary button { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 15px; color: rgba(255,255,255,.85);
  font-variant-numeric: tabular-nums; transition: color var(--dur-fade) var(--ease); }
.summary svg { width: 17px; height: 17px; flex: none; }
.summary svg * { fill: currentColor; }
.summary svg .st { fill: none; stroke: currentColor; }
.app.open .summary button.on { color: var(--violet-text); }
.summary .bar { position: absolute; left: 0; bottom: -1px; width: 25%; height: 2px; background: var(--violet-text);
  transition: transform var(--dur-move) var(--ease), opacity var(--dur-fade) var(--ease); opacity: 0; }
.app.open .summary .bar { opacity: 1; }

.pages { position: relative; flex: 1; overflow: hidden; }
.track-row { display: flex; height: 100%; transition: transform var(--dur-move) var(--ease); }
.track-row.dragging { transition: none; }
.page { flex: 0 0 100%; height: 100%; display: flex; flex-direction: column; }
.page-head { flex: none; text-align: center; padding-top: 18px; }
.page-head svg { width: 20px; height: 20px; margin: 0 auto 8px; }
.page-head svg * { fill: #fff; }
.page-head svg .st { fill: none; stroke: #fff; }
.page-head h2 { font-size: 15px; font-weight: 500; letter-spacing: .06em; }
.page-head em { display: block; font-size: 14px; color: var(--ink-2); margin-top: 1px; }
.page-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 52px; }
.page-foot { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.page-foot div { text-align: center; padding: 14px 4px 16px; border-left: 1px solid var(--line); }
.page-foot div:first-child { border-left: 0; }
.page-foot span { display: block; font-size: 12px; letter-spacing: .06em; color: var(--ink-2); }
.page-foot strong { display: block; margin-top: 4px; font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.1; }
.page-foot small { font-size: 14px; color: var(--ink-2); margin-left: 1px; }
.page-foot .now span, .page-foot .now strong, .page-foot .now small { color: var(--violet-text); }
.page-foot.single { grid-template-columns: 1fr; }
.page-foot.single div { padding: 20px 4px 22px; font-size: 17px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.9); }

.nav { position: absolute; top: 50%; margin-top: -10px; width: 44px; height: 64px; display: grid; place-items: center; z-index: 2; transition: opacity var(--dur-fade) var(--ease); }
.nav svg { width: 11px; height: 18px; }
.nav.prev { left: 2px; } .nav.next { right: 2px; }
.nav:disabled { opacity: .3; cursor: default; }

/* Speed bars */
.bars { width: 100%; height: 100%; max-height: 210px; display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 0; }
.bars .col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.bars .b { width: 20px; height: 20px; border-radius: 20px; background: #fff; opacity: .3; transition: height var(--dur-chart) var(--ease), opacity var(--dur-chart) var(--ease); }
.bars .b.future { opacity: .25; }
.bars .b.cur { background: linear-gradient(180deg, var(--violet) 0%, var(--violet-2) 100%); opacity: 1; }
.bars .lbl { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bars .col.curcol .lbl { color: var(--violet-text); }

/* Heart chart */
.chart { width: 100%; height: 100%; max-height: 220px; }
.chart text { fill: var(--ink-2); font-size: 11px; font-style: italic; font-family: var(--font); }

/* Duration + distance rings */
.ring-box { position: relative; height: 100%; max-height: 210px; aspect-ratio: 1; max-width: 100%; }
.ring-box svg { width: 100%; height: 100%; }
.ring-box .center { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 300; font-variant-numeric: tabular-nums; }
.sec-hand { transform-origin: 100px 100px; transition: transform .6s cubic-bezier(.4,1.4,.5,1); }
.dist-arc { transition: stroke-dashoffset 1.6s var(--ease); }
.dist-knob { transform-origin: 100px 100px; transition: transform 1.6s var(--ease); }

/* Playlist */
/* Playlist drawer: slides in from the left; the rest of the screen is dimmed by an overlay (no drop shadow) */
.list-shade { position: absolute; inset: 0; z-index: 7; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none;
  transition: opacity var(--dur-move) var(--ease); }
.list-shade.show { opacity: 1; pointer-events: auto; }
.playlist { position: absolute; top: 0; bottom: 0; left: 0; width: min(82%, 320px); z-index: 8;
  background: rgba(14,9,20,.94); backdrop-filter: blur(14px);
  padding: 22px 20px; display: flex; flex-direction: column;
  transform: translateX(-100%); transition: transform var(--dur-move) var(--ease); }
.playlist.show { transform: translateX(0); }
.playlist.dragging { transition: none; }
/* Rows follow the drawer in, one after another */
.playlist li { opacity: 0; transform: translateX(-18px); transition: opacity var(--dur-fade) var(--ease), transform var(--dur-move) var(--ease); }
.playlist.show li { opacity: 1; transform: none; }
.playlist.show li:nth-child(1) { transition-delay: .08s; }
.playlist.show li:nth-child(2) { transition-delay: .13s; }
.playlist.show li:nth-child(3) { transition-delay: .18s; }
.playlist header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.playlist h3 { font-size: 13px; letter-spacing: .1em; color: var(--ink-2); font-weight: 500; }
.playlist ul { list-style: none; padding: 0; margin: 0; }
.playlist li button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 0; text-align: left; border-bottom: 1px solid var(--line); }
.playlist li img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.playlist li b { display: block; font-weight: 500; font-size: 15px; }
.playlist li span { font-size: 13px; color: var(--ink-2); }
.playlist li.cur b { color: var(--violet-text); }

.no-anim, .no-anim * { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
}
</style>

</head>
<body>
<div class="phone app" id="app">
  <section class="player" aria-label="Music player">
    <div class="player-bg" id="playerBg"></div>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Playlist">
        <svg viewBox="0 0 24 24"><g fill="#fff"><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/><rect x="8" y="5.2" width="13" height="1.6" rx=".8"/><rect x="8" y="11.2" width="13" height="1.6" rx=".8"/><rect x="8" y="17.2" width="13" height="1.6" rx=".8"/></g></svg>
      </button>
      <button class="icon-btn like" id="likeBtn" aria-label="Like" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 20.3l-1.2-1.1C6.3 15.2 3.3 12.5 3.3 9.2 3.3 6.6 5.4 4.5 8 4.5c1.5 0 2.9.7 4 1.8 1.1-1.1 2.5-1.8 4-1.8 2.6 0 4.7 2.1 4.7 4.7 0 3.3-3 6-7.5 10l-1.2 1.1z" fill="none" stroke="#fff" stroke-width="1.7"/></svg>
      </button>
    </div>

    <div class="disc-wrap">
      <button class="icon-btn skip" id="prevTrack" aria-label="Previous track">
        <svg viewBox="0 0 18 18"><rect x="1" y="2" width="2.4" height="14" fill="#fff"/><path d="M17 2v14L5 9z" fill="#fff"/></svg>
      </button>
      <div class="disc" id="disc">
        <svg class="ring" viewBox="0 0 236 236">
          <circle cx="118" cy="118" r="114" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.5"/>
          <circle id="trackArc" cx="118" cy="118" r="114" fill="none" stroke="#A23BFF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="716.3" stroke-dashoffset="716.3"/>
        </svg>
        <div class="art" id="art"></div>
      </div>
      <button class="icon-btn skip" id="nextTrack" aria-label="Next track">
        <svg viewBox="0 0 18 18"><path d="M1 2v14l12-7z" fill="#fff"/><rect x="14.6" y="2" width="2.4" height="14" fill="#fff"/></svg>
      </button>
    </div>

    <div class="track">
      <h1 id="trackTitle"></h1>
      <p id="trackArtist"></p>
      <div class="time" id="trackTime"></div>
    </div>

    <button class="run-btn" id="runBtn" aria-label="Pause music">
      <svg class="ic-run runner" viewBox="0 0 24 24" aria-hidden="true">
        <g class="r-body" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <g class="r-far">
            <g class="r-thigh b"><line x1="11" y1="13.4" x2="11" y2="17.8" stroke-width="2.4"/><g class="r-shin b"><line x1="11" y1="17.8" x2="11" y2="22" stroke-width="2.2"/></g></g>
            <g class="r-arm a"><line x1="12.4" y1="8.4" x2="12.4" y2="11.4" stroke-width="2"/><g class="r-fore"><line x1="12.4" y1="11.4" x2="12.4" y2="14" stroke-width="1.9"/></g></g>
          </g>
          <line x1="12.7" y1="8" x2="11" y2="13.4" stroke-width="2.8"/>
          <circle cx="14" cy="4.3" r="2.2" fill="#fff" stroke="none"/>
          <g class="r-thigh a"><line x1="11" y1="13.4" x2="11" y2="17.8" stroke-width="2.4"/><g class="r-shin a"><line x1="11" y1="17.8" x2="11" y2="22" stroke-width="2.2"/></g></g>
          <g class="r-arm b"><line x1="12.4" y1="8.4" x2="12.4" y2="11.4" stroke-width="2"/><g class="r-fore"><line x1="12.4" y1="11.4" x2="12.4" y2="14" stroke-width="1.9"/></g></g>
        </g>
      </svg>
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>
    </button>
  </section>

  <div class="hint" id="hint" aria-hidden="true">
    <div class="arrow"><i></i></div>
    <div><b>Swipe up here</b><small>and check out your live stats</small></div>
  </div>

  <div class="shade" id="shade"></div>

  <section class="sheet" id="sheet" aria-label="Workout statistics">
    <div class="summary" id="summary" role="tablist">
      <button role="tab" data-i="0" aria-label="Running speed">
        <svg viewBox="0 0 24 24"><path d="M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A7.3 7.3 0 0 0 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>
        <span id="sSpeed">8km/h</span></button>
      <button role="tab" data-i="1" aria-label="Heart rate">

    else if (e.key === 'ArrowDown' || e.key === 'Escape') { togglePlaylist(false); setOpen(false); }
    else if (S.open && e.key === 'ArrowRight') goPage(S.page + 1);
    else if (S.open && e.key === 'ArrowLeft') goPage(S.page - 1);
  });

  /* ---------- Hint ---------- */
  const hint = $('hint');
  let hintTimer = setTimeout(() => hint.classList.add('show'), 500);
  function dismissHint() {
    clearTimeout(hintTimer);
    if (!hint.isConnected || hint.classList.contains('gone')) return;
    if (!hint.classList.contains('show')) { hint.remove(); return; } // never appeared: just drop it
    hint.classList.add('gone'); setTimeout(() => hint.remove(), 400);
  }
  // Any touch, click or key press on the screen hides the guide bubble
  app.addEventListener('pointerdown', dismissHint, { once: true });
  document.addEventListener('keydown', dismissHint, { once: true });

  /* ---------- Live tick (simulated run) ---------- */
  const r = rng(99);
  function tick() {
    if (S.playing) { S.pos++; if (S.pos >= tracks[S.track].len) setTrack(S.track + 1, 1); else renderTrackPos(); }
    if (S.running) {
      S.elapsed++;
      S.speed = Math.max(6.2, Math.min(9.6, S.speed + (r() - .5) * .5 + (8 - S.speed) * .05));
      S.top = Math.max(S.top, S.speed);
      S.dist += S.speed / 3600;
      S.hr = Math.max(100, Math.min(124, S.hr + (r() - .5) * 2.4 + (118 - S.hr) * .04));
      S.hrSum += S.hr; S.hrCount++;
      // live 10-minute slot
      const li = S.slots.length - 1;
      S.slots[li] = (S.slots[li] * S.slotN + S.speed) / (S.slotN + 1); S.slotN++;
      if (S.elapsed % 600 === 0 && S.slots.length < SLOTS) { S.slots.push(S.speed); S.slotN = 1; }
      // live minute for heart chart
      const hi = S.hrMin.length - 1;
      S.hrMin[hi] = S.hr;
      if (S.elapsed % 60 === 0) { S.hrMin.shift(); S.hrMin.push(S.hr); }
      renderNumbers(); renderDuration();
      if (S.open && S.ready) {
        if (S.page === 0) renderBars(true);
        if (S.page === 1) renderHeart();
        if (S.page === 3) renderDistance(true);
      }
    }
  }

  /* ---------- Boot ---------- */
  renderTrack(); renderNumbers(); renderDuration(); renderHeart(); renderBars(false); renderDistance(false); goPage(0, false);
  setInterval(tick, 1000);
  window.addEventListener('resize', () => { if (S.open && S.ready) renderBars(true); });
})();
</script>

</body>
